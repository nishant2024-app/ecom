# Shared proxy settings for the API. Installed to /etc/nginx/snippets/dairy-proxy.conf
# (see DEPLOYMENT.md). The API trusts X-Forwarded-For, so ONLY Nginx may reach it:
# the compose file binds it to 127.0.0.1 and the firewall blocks port 4000.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite (not append) so a client cannot forge its own address.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
proxy_request_buffering on;
