# Nginx reverse proxy for the single-server deployment (see DEPLOYMENT.md).
#
# Install:
#   sudo cp infra/nginx/dairy.conf /etc/nginx/sites-available/dairy.conf
#   sudo sed -i 's/example\.in/yourdomain.in/g' /etc/nginx/sites-available/dairy.conf
#   sudo ln -s /etc/nginx/sites-available/dairy.conf /etc/nginx/sites-enabled/dairy.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yourdomain.in -d www.yourdomain.in -d api.yourdomain.in -d admin.yourdomain.in
#
# Certbot adds the port-443 server blocks, the certificates and the HTTP → HTTPS redirect for you,
# and renews the certificates automatically. The containers listen on 127.0.0.1 only
# (web 3000, api 4000, admin 8080), so Nginx is the only way in.

# Per-IP request limits. The API also rate-limits per user; this is a first, cheap line of defence.
limit_req_zone $binary_remote_addr zone=dairy_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=dairy_auth:10m rate=5r/s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ── Shop: https://example.in ────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name example.in www.example.in;
  server_tokens off;

  client_max_body_size 1m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
}

# ── API: https://api.example.in ─────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name api.example.in;
  server_tokens off;

  # Photo uploads are up to 20 MB each (the API enforces its own limit).
  client_max_body_size 25m;

  location /v1/auth/ {
    limit_req zone=dairy_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/dairy-proxy.conf;
  }

  # Uploaded photos (only used when photos are stored on this server instead of Cloudflare R2).
  # The API serves them; set R2_PUBLIC_BASE_URL=https://api.example.in/media in the .env file.
  location /media/ {
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/dairy-proxy.conf;
  }

  location / {
    limit_req zone=dairy_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/dairy-proxy.conf;
  }
}

# ── Admin: https://admin.example.in ─────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name admin.example.in;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
  }
}
