# VM-APP (Oracle Ampere). No public ports: traffic arrives through Cloudflare Tunnel.
# Usage on the VM: docker compose -f infra/compose/app.yml --env-file /opt/dairy/.env.app up -d --build
name: dairy-app
x-api: &api
  build: { context: ../.., dockerfile: apps/api/Dockerfile, target: runtime }
  image: dairy-api:${GIT_SHA:-local}
  restart: unless-stopped
  env_file: /opt/dairy/.env.app
  environment:
    GIT_SHA: ${GIT_SHA:-local}
  deploy: { resources: { limits: { memory: 768m } } }

services:
  migrate:
    build: { context: ../.., dockerfile: apps/api/Dockerfile, target: migrate }
    env_file: /opt/dairy/.env.app
    restart: 'no'
  api:
    <<: *api
    depends_on: { migrate: { condition: service_completed_successfully } }
    deploy: { replicas: 2, resources: { limits: { memory: 768m } } }
  worker:
    <<: *api
    command: ['node', 'dist/worker.js']
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: { disable: true }
  web:
    build: { context: ../.., dockerfile: apps/web/Dockerfile }
    image: dairy-web:${GIT_SHA:-local}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    deploy: { resources: { limits: { memory: 1g } } }
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [web, api]
    deploy: { resources: { limits: { memory: 128m } } }
