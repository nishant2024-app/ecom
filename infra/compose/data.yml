# VM-DATA (Oracle Ampere, private network only). Postgres + Valkey.
# Secrets come from /opt/dairy/.env.data (SOPS-decrypted by the deploy job), never from git.
name: dairy-data
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: /opt/dairy/.env.data
    command: >
      postgres
      -c shared_buffers=1536MB -c effective_cache_size=4GB -c work_mem=16MB
      -c max_connections=120 -c wal_level=replica -c archive_mode=on
      -c archive_command='pgbackrest --stanza=main archive-push %p'
      -c log_min_duration_statement=500 -c timezone=UTC
    ports: ['10.0.1.20:5432:5432'] # private VCN address only
    volumes:
      - /srv/postgres:/var/lib/postgresql/data
      - /etc/pgbackrest:/etc/pgbackrest:ro
    shm_size: 512m
    deploy: { resources: { limits: { memory: 3g } } }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory', '400mb', '--maxmemory-policy', 'noeviction', '--requirepass', '${VALKEY_PASSWORD:?set VALKEY_PASSWORD}']
    ports: ['10.0.1.20:6379:6379']
    volumes: ['/srv/valkey:/data']
    deploy: { resources: { limits: { memory: 512m } } }
