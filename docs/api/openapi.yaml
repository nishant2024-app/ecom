openapi: 3.1.0
info:
  title: Dairy Store API
  version: 1.0.0-draft
  summary: Public REST API for the storefront, admin panel, delivery agent app and Android app.
  description: |
    One API for every client. Read the [API guide](https://github.com/nishant2024-app/ecom/blob/main/docs/api/README.md)
    for conventions: authentication, errors, pagination, idempotency, money and dates.

    * Money is always an object with integer **paise**: `{ "amount": 6400, "currency": "INR" }` = ₹64.00.
    * Business dates (`YYYY-MM-DD`) are dates in India Standard Time.
    * Errors use RFC 9457 `application/problem+json`; branch on `code`.
    * Endpoints that create money movements require an `Idempotency-Key` header.

    **Status:** contract-first draft. Once the API exists this file is generated from Fastify route schemas and CI checks it against this contract.
  contact:
    name: Engineering
    email: support@example.in
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.in/v1
    description: Production
  - url: https://api.staging.example.in/v1
    description: Staging (Cashfree sandbox)
  - url: http://localhost:4000/v1
    description: Local development
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Auth
    description: Google sign-in, tokens and sessions
  - name: Meta
    description: App configuration and health
  - name: Catalog
    description: Public catalog, serviceability and slots
  - name: Profile
    description: Customer profile, addresses, devices
  - name: Orders
    description: Cart, checkout and one-time orders
  - name: Subscriptions
    description: Recurring deliveries, pauses, per-date changes, calendar
  - name: Deliveries
    description: Customer view of deliveries
  - name: Wallet
    description: Balance, ledger, top-ups, autopay, statements and invoices
  - name: Agent
    description: Delivery agent runs and offline sync
  - name: Admin
    description: Staff endpoints (core subset; full list in docs/api/admin.md)
  - name: Webhooks
    description: Inbound Cashfree webhooks

paths:
  # ───────────────────────────── Auth ─────────────────────────────
  /auth/nonce:
    post:
      tags: [Auth]
      operationId: createNonce
      summary: Get a single-use nonce for Google sign-in
      security: []
      responses:
        '200':
          description: Nonce valid for 5 minutes
          content:
            application/json:
              schema:
                type: object
                required: [nonce, expiresAt]
                properties:
                  nonce: { type: string, example: n_7bq2Jc0X3s9mVxK1 }
                  expiresAt: { type: string, format: date-time }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/google:
    post:
      tags: [Auth]
      operationId: signInWithGoogle
      summary: Exchange a Google ID token for a session
      description: |
        Web clients (`web`, `admin`, `agent`) receive tokens as httpOnly cookies.
        Android receives `accessToken` and `refreshToken` in the body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken, client]
              properties:
                idToken: { type: string, description: Google ID token (JWT) obtained with the nonce from /auth/nonce }
                client: { type: string, enum: [web, admin, agent, android] }
                deviceName: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Rotate access and refresh tokens
      security: []
      requestBody:
        required: false
        description: Android sends the refresh token; browsers send nothing (cookie is used).
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Signed out }

  /auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      summary: List my sessions (devices)
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: Sign out one device
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/totp/setup:
    post:
      tags: [Auth]
      operationId: setupTotp
      summary: Start TOTP enrolment (staff)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Enrolment data; recovery codes are shown once
          content:
            application/json:
              schema:
                type: object
                required: [otpauthUri, recoveryCodes]
                properties:
                  otpauthUri: { type: string }
                  recoveryCodes:
                    type: array
                    items: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/totp/verify:
    post:
      tags: [Auth]
      operationId: verifyTotp
      summary: Verify a TOTP code (enrolment or sign-in)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Verified; full session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/.well-known/jwks.json:
    get:
      tags: [Auth]
      operationId: getJwks
      summary: Public keys for verifying our access tokens
      security: []
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { type: object, additionalProperties: true }

  # ───────────────────────────── Meta ─────────────────────────────
  /app-config:
    get:
      tags: [Meta]
      operationId: getAppConfig
      summary: Minimum versions, feature flags, support and legal info
      security: []
      responses:
        '200':
          description: App configuration
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }

  /health/live:
    get:
      tags: [Meta]
      operationId: healthLive
      summary: Liveness
      security: []
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /health/ready:
    get:
      tags: [Meta]
      operationId: healthReady
      summary: Readiness (database and cache reachable)
      security: []
      responses:
        '200': { description: Ready }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────── Catalog ─────────────────────────────
  /store/serviceability:
    get:
      tags: [Catalog]
      operationId: checkServiceability
      summary: Check if a pincode or location is served
      security: []
      parameters:
        - name: pincode
          in: query
          schema: { type: string, pattern: '^[1-9][0-9]{5}$' }
        - name: lat
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: Result (not serviceable is not an error)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Serviceability' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /store/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Category tree
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Categories
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }

  /store/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: List and search products
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: zoneId
          in: query
          schema: { type: string }
        - name: category
          in: query
          description: Category slug
          schema: { type: string }
        - name: q
          in: query
          description: Search text; understands Hindi/Hinglish synonyms and typos
          schema: { type: string, maxLength: 100 }
        - name: subscribable
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Products
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductSummary' }
                  page: { $ref: '#/components/schemas/PageInfo' }

  /store/products/{slug}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Product detail
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: zoneId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Product
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /store/delivery-slots:
    get:
      tags: [Catalog]
      operationId: listDeliverySlots
      summary: Slots with open dates and cutoffs for a zone
      security: []
      parameters:
        - name: zoneId
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 31, default: 14 }
      responses:
        '200':
          description: Slots
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SlotWithDates' }

  /store/home:
    get:
      tags: [Catalog]
      operationId: getHome
      summary: Home page blocks and banners
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: zoneId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Blocks
          content:
            application/json:
              schema:
                type: object
                required: [blocks]
                properties:
                  blocks:
                    type: array
                    items:
                      type: object
                      required: [id, kind, data]
                      properties:
                        id: { type: string }
                        kind: { type: string, examples: [hero, product_row, category_grid, banner, text] }
                        data: { type: object, additionalProperties: true }

  # ───────────────────────────── Profile ─────────────────────────────
  /store/me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: My profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Update profile
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                phone: { $ref: '#/components/schemas/IndianMobile' }
                language: { type: string, enum: [en, hi] }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Profile]
      operationId: requestAccountDeletion
      summary: Request account deletion
      description: Revokes sessions and cancels subscriptions now; erases personal data after 30 days. Tax records are retained as required by law.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: Deletion scheduled
          content:
            application/json:
              schema:
                type: object
                required: [status, erasesOn]
                properties:
                  status: { type: string, const: deletion_requested }
                  erasesOn: { type: string, format: date }
                  walletRefund: { $ref: '#/components/schemas/Money' }

  /store/me/addresses:
    get:
      tags: [Profile]
      operationId: listAddresses
      summary: List addresses
      responses:
        '200':
          description: Addresses
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
    post:
      tags: [Profile]
      operationId: createAddress
      summary: Add address
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /store/me/addresses/{addressId}:
    parameters:
      - name: addressId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Profile]
      operationId: updateAddress
      summary: Update address
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Profile]
      operationId: deleteAddress
      summary: Remove address (not allowed while used by an active subscription)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Removed }
        '409': { $ref: '#/components/responses/Conflict' }

  /store/me/devices:
    post:
      tags: [Profile]
      operationId: registerDevice
      summary: Register a push token (FCM or Web Push)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, pushToken]
              properties:
                platform: { type: string, enum: [web, android] }
                pushToken: { type: string, description: 'FCM token, or JSON-serialised PushSubscription for web' }
                appVersion: { type: string }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }

  /store/me/devices/{deviceId}:
    delete:
      tags: [Profile]
      operationId: deleteDevice
      summary: Remove a push token
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed }

  /store/me/notification-preferences:
    get:
      tags: [Profile]
      operationId: getNotificationPreferences
      summary: Get notification preferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
    put:
      tags: [Profile]
      operationId: setNotificationPreferences
      summary: Set notification preferences
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }

  /store/me/bottles:
    get:
      tags: [Profile]
      operationId: getBottles
      summary: Bottle balance and history
      responses:
        '200':
          description: Bottles
          content:
            application/json:
              schema:
                type: object
                required: [outstanding, depositHeld, history]
                properties:
                  outstanding: { type: integer }
                  depositHeld: { $ref: '#/components/schemas/Money' }
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        given: { type: integer }
                        returned: { type: integer }

  /store/me/referral:
    get:
      tags: [Profile]
      operationId: getReferral
      summary: My referral code and rewards
      responses:
        '200':
          description: Referral info
          content:
            application/json:
              schema:
                type: object
                required: [code, shareUrl, reward]
                properties:
                  code: { type: string, example: ASHA50 }
                  shareUrl: { type: string, format: uri }
                  reward: { $ref: '#/components/schemas/Money' }
                  referrals:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        status: { type: string, enum: [pending, rewarded, blocked] }

  # ───────────────────────────── Cart & orders ─────────────────────────────
  /store/cart:
    get:
      tags: [Orders]
      operationId: getCart
      summary: Current cart
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  /store/cart/items/{variantId}:
    put:
      tags: [Orders]
      operationId: setCartItem
      summary: Set quantity of a variant (0 removes it)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: variantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0, maximum: 50 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /store/cart/coupon:
    put:
      tags: [Orders]
      operationId: applyCoupon
      summary: Apply a coupon
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 32 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Orders]
      operationId: removeCoupon
      summary: Remove the coupon
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  /store/checkout/quote:
    post:
      tags: [Orders]
      operationId: quoteCheckout
      summary: Price the cart for a delivery date, slot and address
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryTarget' }
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /store/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: My orders
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  page: { $ref: '#/components/schemas/PageInfo' }
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place a one-time order
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DeliveryTarget'
                - type: object
                  required: [paymentMethod]
                  properties:
                    paymentMethod: { type: string, enum: [wallet, online] }
      responses:
        '201':
          description: Order placed. For `online`, open Cashfree checkout with `payment.paymentSessionId`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /store/orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Order detail
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /store/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel before the cutoff
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refundTo: { type: string, enum: [wallet, source], default: wallet }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ───────────────────────────── Subscriptions ─────────────────────────────
  /store/subscriptions:
    get:
      tags: [Subscriptions]
      operationId: listSubscriptions
      summary: My subscriptions
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, cancelled] }
      responses:
        '200':
          description: Subscriptions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Subscription' }
    post:
      tags: [Subscriptions]
      operationId: createSubscription
      summary: Create a subscription
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /store/subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      summary: Subscription detail
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Subscriptions]
      operationId: updateSubscription
      summary: Change pattern, items, address or slot from the next open date
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                pattern: { $ref: '#/components/schemas/SubscriptionPattern' }
                items:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/SubscriptionItemInput' }
                addressId: { type: string }
                slotId: { type: string }
                endsOn: { type: [string, 'null'], format: date }
      responses:
        '200':
          description: Updated; `effectiveFrom` tells the first affected date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /store/subscriptions/{subscriptionId}/pauses:
    post:
      tags: [Subscriptions]
      operationId: pauseSubscription
      summary: Pause a date range
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startsOn, endsOn]
              properties:
                startsOn: { type: string, format: date }
                endsOn: { type: string, format: date }
      responses:
        '201':
          description: Pause created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pause' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /store/subscriptions/{subscriptionId}/pauses/{pauseId}:
    delete:
      tags: [Subscriptions]
      operationId: deletePause
      summary: Remove a pause, or end it early if already started
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/SubscriptionId'
        - name: pauseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed or shortened }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /store/subscriptions/{subscriptionId}/overrides/{date}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
      - name: date
        in: path
        required: true
        schema: { type: string, format: date }
    put:
      tags: [Subscriptions]
      operationId: setOverride
      summary: Change one date (empty items skips the day)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [variantId, quantity]
                    properties:
                      variantId: { type: string }
                      quantity: { type: integer, minimum: 0, maximum: 20 }
      responses:
        '200':
          description: Saved; returns the calendar day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarDay' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Subscriptions]
      operationId: deleteOverride
      summary: Undo a one-date change
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Removed }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /store/subscriptions/{subscriptionId}/cancel:
    post:
      tags: [Subscriptions]
      operationId: cancelSubscription
      summary: Cancel from the next open date
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, enum: [moving, price, quality, delivery_issues, not_needed, other] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

  /store/calendar:
    get:
      tags: [Subscriptions]
      operationId: getCalendar
      summary: Month view of planned and past deliveries (the milk card)
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', example: '2026-12' }
      responses:
        '200':
          description: Calendar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }

  # ───────────────────────────── Deliveries ─────────────────────────────
  /store/deliveries:
    get:
      tags: [Deliveries]
      operationId: listDeliveries
      summary: Deliveries in a date range
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Delivery' }

  /store/deliveries/{deliveryId}:
    get:
      tags: [Deliveries]
      operationId: getDelivery
      summary: Delivery detail
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
      responses:
        '200':
          description: Delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '404': { $ref: '#/components/responses/NotFound' }

  /store/deliveries/{deliveryId}/issues:
    post:
      tags: [Deliveries]
      operationId: reportDeliveryIssue
      summary: Report a problem with a delivery
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/DeliveryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [not_received, damaged, wrong_item, quality, late, other] }
                note: { type: string, maxLength: 1000 }
                photoUploadId: { type: [string, 'null'] }
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                type: object
                required: [ticketId, status]
                properties:
                  ticketId: { type: string }
                  status: { type: string, enum: [open, auto_credited] }
                  credit: { $ref: '#/components/schemas/Money' }

  # ───────────────────────────── Wallet ─────────────────────────────
  /store/wallet:
    get:
      tags: [Wallet]
      operationId: getWallet
      summary: Balance, projection and autopay status
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }

  /store/wallet/ledger:
    get:
      tags: [Wallet]
      operationId: listLedger
      summary: Ledger entries, newest first
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LedgerEntry' }
                  page: { $ref: '#/components/schemas/PageInfo' }

  /store/wallet/topups:
    post:
      tags: [Wallet]
      operationId: createTopup
      summary: Start a wallet top-up through Cashfree
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
      responses:
        '201':
          description: Top-up created; open Cashfree checkout with `payment.paymentSessionId`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topup' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /store/wallet/topups/{topupId}:
    get:
      tags: [Wallet]
      operationId: getTopup
      summary: Top-up status (poll after checkout)
      parameters:
        - name: topupId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Top-up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topup' }
        '404': { $ref: '#/components/responses/NotFound' }

  /store/wallet/autopay:
    get:
      tags: [Wallet]
      operationId: getAutopay
      summary: Autopay mandate
      responses:
        '200':
          description: Mandate (status `none` if not set up)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Autopay' }
    post:
      tags: [Wallet]
      operationId: setupAutopay
      summary: Set up UPI Autopay auto-recharge
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [threshold, recharge, monthlyCap]
              properties:
                threshold: { $ref: '#/components/schemas/Money' }
                recharge: { $ref: '#/components/schemas/Money' }
                monthlyCap: { $ref: '#/components/schemas/Money' }
      responses:
        '201':
          description: Pending customer authorisation in their UPI app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Autopay' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Wallet]
      operationId: cancelAutopay
      summary: Cancel autopay
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Cancelled }

  /store/payments/{paymentId}:
    get:
      tags: [Wallet]
      operationId: getPayment
      summary: Payment status (for online orders)
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/NotFound' }

  /store/statements/{month}:
    get:
      tags: [Wallet]
      operationId: getStatement
      summary: Monthly statement
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Statement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }

  /store/statements/{month}/pdf:
    get:
      tags: [Wallet]
      operationId: getStatementPdf
      summary: Statement PDF
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '302':
          description: Redirect to a short-lived signed URL
          headers:
            Location:
              schema: { type: string, format: uri }

  /store/invoices:
    get:
      tags: [Wallet]
      operationId: listInvoices
      summary: My invoices
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
                  page: { $ref: '#/components/schemas/PageInfo' }

  /store/invoices/{invoiceId}/pdf:
    get:
      tags: [Wallet]
      operationId: getInvoicePdf
      summary: Invoice PDF
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to a short-lived signed URL
          headers:
            Location:
              schema: { type: string, format: uri }

  /store/notifications:
    get:
      tags: [Profile]
      operationId: listNotifications
      summary: In-app notifications
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  page: { $ref: '#/components/schemas/PageInfo' }

  /store/notifications/read:
    post:
      tags: [Profile]
      operationId: markNotificationsRead
      summary: Mark notifications as read
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
                all: { type: boolean }
      responses:
        '204': { description: Marked }

  # ───────────────────────────── Agent ─────────────────────────────
  /agent/me:
    get:
      tags: [Agent]
      operationId: getAgent
      summary: Agent profile
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
                  phone: { type: string }

  /agent/runs:
    get:
      tags: [Agent]
      operationId: listAgentRuns
      summary: My runs for a date
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Runs (without stops)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RunSummary' }

  /agent/runs/{runId}:
    get:
      tags: [Agent]
      operationId: getAgentRun
      summary: Run with ordered stops and load sheet
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/runs/{runId}/start:
    post:
      tags: [Agent]
      operationId: startRun
      summary: Start the run
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunSummary' }

  /agent/runs/{runId}/complete:
    post:
      tags: [Agent]
      operationId: completeRun
      summary: Finish the run
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunSummary' }
        '409': { $ref: '#/components/responses/Conflict' }

  /agent/stops/{deliveryId}/events:
    post:
      tags: [Agent]
      operationId: recordStopEvent
      summary: Record one stop outcome
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/DeliveryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentEventInput' }
      responses:
        '200':
          description: Applied (or duplicate)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResult' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /agent/sync:
    post:
      tags: [Agent]
      operationId: syncAgentEvents
      summary: Upload a batch of offline events
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 200
                  items:
                    allOf:
                      - $ref: '#/components/schemas/AgentEventInput'
                      - type: object
                        required: [deliveryId]
                        properties:
                          deliveryId: { type: string }
      responses:
        '200':
          description: Per-event results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/SyncResult' }

  /agent/uploads:
    post:
      tags: [Agent]
      operationId: createAgentUpload
      summary: Signed URL for a proof photo
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '201':
          description: Upload target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }

  # ───────────────────────────── Admin (core) ─────────────────────────────
  /admin/dashboard:
    get:
      tags: [Admin]
      operationId: adminDashboard
      summary: KPIs for a date (permission catalog.read)
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/dispatch:
    get:
      tags: [Admin]
      operationId: adminDispatchBoard
      summary: Dispatch board (permission dispatch.manage)
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: slotId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchBoard' }

  /admin/dispatch/cutoff-runs:
    post:
      tags: [Admin]
      operationId: adminRerunCutoff
      summary: Re-run the cutoff job (permission dispatch.manage)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, slotId]
              properties:
                date: { type: string, format: date }
                slotId: { type: string }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }

  /admin/production-plan:
    get:
      tags: [Admin]
      operationId: adminProductionPlan
      summary: Units to produce (permission inventory.write)
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: slotId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionPlan' }

  /admin/products:
    get:
      tags: [Admin]
      operationId: adminListProducts
      summary: List products (permission catalog.read)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, archived] }
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminProduct' }
                  page: { $ref: '#/components/schemas/PageInfo' }
    post:
      tags: [Admin]
      operationId: adminCreateProduct
      summary: Create a product with variants (permission catalog.write)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminProductInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProduct' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Admin]
      operationId: adminGetProduct
      summary: Product detail
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProduct' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      operationId: adminUpdateProduct
      summary: Update a product (price fields need pricing.write)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminProductInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProduct' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/customers:
    get:
      tags: [Admin]
      operationId: adminListCustomers
      summary: Search customers (permission customers.read)
      parameters:
        - name: q
          in: query
          description: Name, email, phone or pincode
          schema: { type: string }
        - name: zoneId
          in: query
          schema: { type: string }
        - name: lowBalance
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminCustomer' }
                  page: { $ref: '#/components/schemas/PageInfo' }

  /admin/customers/{customerId}/wallet/adjustments:
    post:
      tags: [Admin]
      operationId: adminAdjustWallet
      summary: Credit or debit a wallet with a reason (permission wallet.adjust)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: customerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, direction, reason]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                direction: { type: string, enum: [credit, debit] }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '201':
          description: Ledger entry created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/refunds:
    post:
      tags: [Admin]
      operationId: adminCreateRefund
      summary: Refund a delivery or order (permission orders.refund)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, destination, reason]
              properties:
                orderId: { type: string }
                deliveryId: { type: string }
                amount: { $ref: '#/components/schemas/Money' }
                destination: { type: string, enum: [wallet, source] }
                reason: { type: string, maxLength: 500 }
              oneOf:
                - required: [orderId]
                - required: [deliveryId]
      responses:
        '201':
          description: Refund created
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [pending, success, failed] }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/batches:
    get:
      tags: [Admin]
      operationId: adminListBatches
      summary: Batches (permission inventory.write)
      parameters:
        - name: variantId
          in: query
          schema: { type: string }
        - name: expiringBefore
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Batches
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Batch' }
                  page: { $ref: '#/components/schemas/PageInfo' }
    post:
      tags: [Admin]
      operationId: adminCreateBatch
      summary: Record production (permission inventory.write)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, code, manufacturedOn, expiresOn, quantity]
              properties:
                variantId: { type: string }
                code: { type: string, maxLength: 32 }
                manufacturedOn: { type: string, format: date }
                expiresOn: { type: string, format: date }
                quantity: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }

  /admin/reports/{report}:
    get:
      tags: [Admin]
      operationId: adminReport
      summary: Reports (JSON or CSV)
      parameters:
        - name: report
          in: path
          required: true
          schema: { type: string, enum: [sales, gst, subscriptions, products, routes, agents, wastage, wallet] }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: Report rows
          content:
            application/json:
              schema:
                type: object
                required: [columns, rows]
                properties:
                  columns:
                    type: array
                    items: { type: string }
                  rows:
                    type: array
                    items:
                      type: array
                      items: {}
            text/csv:
              schema: { type: string }
        '202':
          description: Large export queued as a job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }

  # ───────────────────────────── Webhooks ─────────────────────────────
  /webhooks/cashfree/payments:
    post:
      tags: [Webhooks]
      operationId: cashfreePaymentWebhook
      summary: Cashfree payment and refund events
      description: Verified with HMAC-SHA256 over `x-webhook-timestamp` + raw body. See docs/api/webhooks.md.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: { type: string, examples: [PAYMENT_SUCCESS_WEBHOOK, PAYMENT_FAILED_WEBHOOK, PAYMENT_USER_DROPPED_WEBHOOK, REFUND_STATUS_WEBHOOK] }
                event_time: { type: string }
                data: { type: object, additionalProperties: true }
      responses:
        '200': { description: Processed or duplicate }
        '400': { description: Invalid signature or payload }
        '500': { description: Processing failed; Cashfree will retry }

  /webhooks/cashfree/subscriptions:
    post:
      tags: [Webhooks]
      operationId: cashfreeSubscriptionWebhook
      summary: Cashfree subscription (UPI Autopay) events
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: { type: string }
                event_time: { type: string }
                data: { type: object, additionalProperties: true }
      responses:
        '200': { description: Processed or duplicate }
        '400': { description: Invalid signature or payload }
        '500': { description: Processing failed; Cashfree will retry }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /auth/google or /auth/refresh (Android, server-to-server)
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: httpOnly cookie set for browser clients. Unsafe methods also need the X-CSRF-Token header.

  headers:
    ETag:
      description: Entity tag; send back in If-None-Match to get 304
      schema: { type: string }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID per logical action. Reuse it when retrying.
      schema: { type: string, format: uuid }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated browser clients on unsafe methods; value of the csrf_token cookie.
      schema: { type: string }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string, enum: [en, hi], default: en }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from page.nextCursor
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Month:
      name: month
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', example: '2026-11' }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string }
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    WebhookSignature:
      name: x-webhook-signature
      in: header
      required: true
      schema: { type: string }
    WebhookTimestamp:
      name: x-webhook-timestamp
      in: header
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Not signed in, token expired, or Google token invalid
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Missing permission, CSRF failure, or not an allowed staff/agent account
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found (or not yours)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflict, or idempotency key reused/in progress
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Business rule failed (cutoff passed, not serviceable, insufficient balance, …)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Overloaded or in maintenance
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ── Primitives ──
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Amount in paise (1/100 rupee). Negative for debits., example: 6400 }
        currency: { type: string, const: INR }
    IndianMobile:
      type: string
      pattern: '^\+91[6-9][0-9]{9}$'
      example: '+919876543210'
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    PageInfo:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable error code. See docs/api/README.md#error-codes.
          examples: [VALIDATION_FAILED, AUTH_TOKEN_EXPIRED, CUTOFF_PASSED, INSUFFICIENT_WALLET_BALANCE]
        detail: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string, description: JSON Pointer to the field }
              code: { type: string }
              message: { type: string }
    Job:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        resultUrl: { type: [string, 'null'], format: uri }

    # ── Auth ──
    UserSummary:
      type: object
      required: [type, id, name, email]
      properties:
        type: { type: string, enum: [customer, staff, agent] }
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        language: { type: string, enum: [en, hi] }
        role: { type: string, description: Staff role (staff only) }
        profileComplete: { type: boolean }
    AuthResult:
      type: object
      required: [user, expiresIn]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        isNewUser: { type: boolean }
        totpRequired: { type: boolean }
        expiresIn: { type: integer, description: Access token lifetime in seconds, example: 900 }
        accessToken: { type: string, description: Android only }
        refreshToken: { type: string, description: Android only }
    Session:
      type: object
      required: [id, client, createdAt, lastUsedAt, current]
      properties:
        id: { type: string }
        client: { type: string, enum: [web, admin, agent, android] }
        deviceName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }
    AppConfig:
      type: object
      required: [minVersions, features, support, legal]
      properties:
        minVersions:
          type: object
          properties:
            android: { type: integer, description: Minimum versionCode }
            web: { type: string }
        latestVersions:
          type: object
          properties:
            android: { type: integer }
        features:
          type: object
          additionalProperties: { type: boolean }
        support:
          type: object
          properties:
            phone: { type: string }
            email: { type: string, format: email }
            whatsapp: { type: [string, 'null'] }
        legal:
          type: object
          properties:
            fssai: { type: string }
            privacyUrl: { type: string, format: uri }
            termsUrl: { type: string, format: uri }
        wallet:
          type: object
          properties:
            minTopup: { $ref: '#/components/schemas/Money' }
            maxTopup: { $ref: '#/components/schemas/Money' }

    # ── Catalog ──
    Image:
      type: object
      required: [url, alt, width, height]
      properties:
        url: { type: string, format: uri }
        alt: { type: string }
        width: { type: integer }
        height: { type: integer }
        srcset:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              width: { type: integer }
              format: { type: string, enum: [avif, webp, jpeg] }
    Media:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, video] }
        image: { $ref: '#/components/schemas/Image' }
        video:
          type: object
          properties:
            mp4Url: { type: string, format: uri }
            webmUrl: { type: string, format: uri }
            posterUrl: { type: string, format: uri }
            durationSeconds: { type: number }
    Category:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }
    Variant:
      type: object
      required: [id, packSize, price, subscribable, available]
      properties:
        id: { type: string }
        sku: { type: string }
        packSize: { type: string, example: 500 ml }
        price: { $ref: '#/components/schemas/Money' }
        mrp: { $ref: '#/components/schemas/Money' }
        subscriptionPrice: { $ref: '#/components/schemas/Money' }
        bottleDeposit: { $ref: '#/components/schemas/Money' }
        subscribable: { type: boolean }
        available: { type: boolean }
        maxPerDay: { type: [integer, 'null'] }
    ProductAttributes:
      type: object
      properties:
        animal: { type: string, enum: [cow, buffalo, mixed, goat] }
        fatPercent: { type: number }
        snfPercent: { type: number }
        pasteurised: { type: boolean }
        a2: { type: boolean }
        sourceFarm: { type: string }
    ProductSummary:
      type: object
      required: [id, slug, name, isVeg, fromPrice, variants]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        category:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
        image: { $ref: '#/components/schemas/Image' }
        isVeg: { type: boolean }
        attributes: { $ref: '#/components/schemas/ProductAttributes' }
        fromPrice: { $ref: '#/components/schemas/Money' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          properties:
            description: { type: string, description: Sanitised HTML }
            media:
              type: array
              items: { $ref: '#/components/schemas/Media' }
            nutrition:
              type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  per100: { type: string }
            shelfLifeDays: { type: integer }
            storage: { type: string, enum: [chilled, frozen, ambient] }
            packaging: { type: string, enum: [pouch, bottle, tub, box] }
            fssaiNumber: { type: string }
            hsnCode: { type: string }
    Serviceability:
      type: object
      required: [serviceable]
      properties:
        serviceable: { type: boolean }
        needsPin: { type: boolean }
        zone:
          type: [object, 'null']
          properties:
            id: { type: string }
            name: { type: string }
        slots:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              code: { type: string }
              label: { type: string }
              nextDeliveryDate: { type: string, format: date }
              cutoffAt: { type: string, format: date-time }
    SlotWithDates:
      type: object
      required: [id, code, label, dates]
      properties:
        id: { type: string }
        code: { type: string, examples: [morning, evening] }
        label: { type: string, example: 5–8 AM }
        dates:
          type: array
          items:
            type: object
            required: [date, cutoffAt, open]
            properties:
              date: { type: string, format: date }
              cutoffAt: { type: string, format: date-time }
              open: { type: boolean }

    # ── Profile ──
    Customer:
      type: object
      required: [id, name, email, language, profileComplete]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        language: { type: string, enum: [en, hi] }
        profileComplete: { type: boolean, description: True once phone and a default serviceable address exist }
        defaultAddressId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    AddressInput:
      type: object
      required: [line1, city, state, pincode]
      properties:
        label: { type: string, maxLength: 30 }
        line1: { type: string, maxLength: 120 }
        line2: { type: string, maxLength: 120 }
        landmark: { type: string, maxLength: 120 }
        society: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 60 }
        state: { type: string, maxLength: 60 }
        pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        deliveryInstructions: { type: string, maxLength: 300 }
        isDefault: { type: boolean }
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [id, zoneId]
          properties:
            id: { type: string }
            zoneId: { type: string }
    NotificationPreferences:
      type: object
      properties:
        marketingPush: { type: boolean }
        marketingEmail: { type: boolean }
        cutoffReminder: { type: boolean }
        deliveredPush: { type: boolean }
    Notification:
      type: object
      required: [id, title, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        link: { type: [string, 'null'] }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    # ── Orders ──
    CartLine:
      type: object
      required: [variantId, name, quantity, unitPrice, total, available]
      properties:
        variantId: { type: string }
        name: { type: string }
        image: { $ref: '#/components/schemas/Image' }
        quantity: { type: integer }
        unitPrice: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        available: { type: boolean }
    Cart:
      type: object
      required: [lines, subtotal, discount, total]
      properties:
        lines:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
        coupon:
          type: [object, 'null']
          properties:
            code: { type: string }
            description: { type: string }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    DeliveryTarget:
      type: object
      required: [addressId, slotId, deliveryDate]
      properties:
        addressId: { type: string }
        slotId: { type: string }
        deliveryDate: { type: string, format: date }
    Quote:
      type: object
      required: [lines, subtotal, discount, deposit, total, taxIncluded, walletBalance, canPayFromWallet, cutoffAt]
      properties:
        lines:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        taxIncluded: { $ref: '#/components/schemas/Money' }
        walletBalance: { $ref: '#/components/schemas/Money' }
        canPayFromWallet: { type: boolean }
        cutoffAt: { type: string, format: date-time }
        warnings:
          type: array
          items: { type: string }
    PaymentSession:
      type: object
      required: [id, provider, paymentSessionId, environment]
      properties:
        id: { type: string }
        provider: { type: string, const: cashfree }
        paymentSessionId: { type: string, description: Pass to the Cashfree JS or Android SDK }
        environment: { type: string, enum: [sandbox, production] }
    Payment:
      type: object
      required: [id, purpose, amount, status]
      properties:
        id: { type: string }
        purpose: { type: string, enum: [topup, order] }
        amount: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [created, pending, success, failed, user_dropped, refunded] }
        method: { type: [string, 'null'], examples: [upi, card, netbanking] }
        updatedAt: { type: string, format: date-time }
    OrderStatus:
      type: string
      enum: [pending_payment, confirmed, scheduled, out_for_delivery, delivered, failed, cancelled, refunded]
    Order:
      type: object
      required: [id, number, status, deliveryDate, slot, lines, total, paymentMethod, createdAt]
      properties:
        id: { type: string }
        number: { type: string, example: D-261202-0042 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        deliveryDate: { type: string, format: date }
        slot:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            label: { type: string }
        addressId: { type: string }
        lines:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        paymentMethod: { type: string, enum: [wallet, online] }
        payment:
          oneOf:
            - $ref: '#/components/schemas/PaymentSession'
            - type: 'null'
        cancellableUntil: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    # ── Subscriptions ──
    SubscriptionPattern:
      type: string
      enum: [daily, alternate, weekdays]
    SubscriptionItemInput:
      type: object
      required: [variantId]
      properties:
        variantId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 20, description: For daily and alternate patterns }
        weekdayQuantities:
          type: array
          description: For the weekdays pattern; 7 integers, Monday first
          minItems: 7
          maxItems: 7
          items: { type: integer, minimum: 0, maximum: 20 }
    SubscriptionInput:
      type: object
      required: [addressId, slotId, pattern, startsOn, items]
      properties:
        addressId: { type: string }
        slotId: { type: string }
        pattern: { $ref: '#/components/schemas/SubscriptionPattern' }
        startsOn: { type: string, format: date }
        endsOn: { type: [string, 'null'], format: date }
        items:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/SubscriptionItemInput' }
    Pause:
      type: object
      required: [id, startsOn, endsOn]
      properties:
        id: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
    Subscription:
      type: object
      required: [id, status, pattern, startsOn, address, slot, items, pauses]
      properties:
        id: { type: string }
        status: { type: string, enum: [active, cancelled] }
        pattern: { $ref: '#/components/schemas/SubscriptionPattern' }
        startsOn: { type: string, format: date }
        endsOn: { type: [string, 'null'], format: date }
        effectiveFrom: { type: string, format: date, description: First date affected by the last change }
        address:
          type: object
          properties:
            id: { type: string }
            label: { type: string }
        slot:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            label: { type: string }
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/SubscriptionItemInput'
              - type: object
                properties:
                  name: { type: string }
                  unitPrice: { $ref: '#/components/schemas/Money' }
        estimatedMonthly: { $ref: '#/components/schemas/Money' }
        pauses:
          type: array
          items: { $ref: '#/components/schemas/Pause' }
        nextDelivery:
          type: [object, 'null']
          properties:
            date: { type: string, format: date }
            cutoffAt: { type: string, format: date-time }
    CalendarDay:
      type: object
      required: [date, state, items, editable]
      properties:
        date: { type: string, format: date }
        state:
          type: string
          enum: [planned, scheduled, out_for_delivery, delivered, not_available, refused, missed, skipped_low_balance, paused, holiday, none]
        deliveryId: { type: [string, 'null'] }
        items:
          type: array
          items:
            type: object
            required: [variantId, name, quantity]
            properties:
              variantId: { type: string }
              name: { type: string }
              quantity: { type: integer }
        charge: { $ref: '#/components/schemas/Money' }
        estimatedCharge: { $ref: '#/components/schemas/Money' }
        editable: { type: boolean }
        cutoffAt: { type: [string, 'null'], format: date-time }
    Calendar:
      type: object
      required: [month, today, days]
      properties:
        month: { type: string, example: '2026-12' }
        today: { type: string, format: date }
        days:
          type: array
          items: { $ref: '#/components/schemas/CalendarDay' }
        totals:
          type: object
          properties:
            deliveredDays: { type: integer }
            units: { type: integer }
            spent: { $ref: '#/components/schemas/Money' }

    # ── Deliveries ──
    DeliveryStatus:
      type: string
      enum: [scheduled, packed, out_for_delivery, delivered, not_available, refused, missed, skipped_low_balance, cancelled]
    Delivery:
      type: object
      required: [id, date, slot, status, items]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        slot:
          type: object
          properties:
            code: { type: string }
            label: { type: string }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              quantity: { type: integer }
              batch: { type: [string, 'null'] }
              expiresOn: { type: [string, 'null'], format: date }
        charge: { $ref: '#/components/schemas/Money' }
        events:
          type: array
          items:
            type: object
            required: [type, at]
            properties:
              type: { type: string }
              at: { type: string, format: date-time }
              bottlesCollected: { type: integer }
        proofPhotoUrl: { type: [string, 'null'], format: uri }
        invoiceId: { type: [string, 'null'] }

    # ── Wallet ──
    Wallet:
      type: object
      required: [balance, overdraftLimit, lowBalance]
      properties:
        balance: { $ref: '#/components/schemas/Money' }
        overdraftLimit: { $ref: '#/components/schemas/Money' }
        projected:
          type: object
          properties:
            next7Days: { $ref: '#/components/schemas/Money' }
            runsOutOn: { type: [string, 'null'], format: date }
        lowBalance: { type: boolean }
        autopay: { $ref: '#/components/schemas/Autopay' }
    LedgerEntry:
      type: object
      required: [id, kind, amount, balanceAfter, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [topup, delivery_charge, order_payment, refund, promo, adjustment, reversal, deposit] }
        amount: { $ref: '#/components/schemas/Money' }
        balanceAfter: { $ref: '#/components/schemas/Money' }
        memo: { type: string }
        reference:
          type: [object, 'null']
          properties:
            type: { type: string }
            id: { type: string }
        createdAt: { type: string, format: date-time }
    Topup:
      type: object
      required: [id, status, amount]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, paid, failed, expired] }
        amount: { $ref: '#/components/schemas/Money' }
        source: { type: string, enum: [manual, autopay] }
        payment: { $ref: '#/components/schemas/PaymentSession' }
        balanceAfter: { $ref: '#/components/schemas/Money' }
    Autopay:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [none, pending_authorisation, active, paused, cancelled] }
        threshold: { $ref: '#/components/schemas/Money' }
        recharge: { $ref: '#/components/schemas/Money' }
        monthlyCap: { $ref: '#/components/schemas/Money' }
        authorisation:
          type: [object, 'null']
          properties:
            url: { type: string, format: uri }
    Statement:
      type: object
      required: [month, opening, topups, charges, refunds, closing]
      properties:
        month: { type: string }
        opening: { $ref: '#/components/schemas/Money' }
        topups: { $ref: '#/components/schemas/Money' }
        charges: { $ref: '#/components/schemas/Money' }
        refunds: { $ref: '#/components/schemas/Money' }
        closing: { $ref: '#/components/schemas/Money' }
        deliveredDays: { type: integer }
        byProduct:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              units: { type: integer }
              amount: { $ref: '#/components/schemas/Money' }
        recapVideoUrl: { type: [string, 'null'], format: uri }
        pdfUrl: { type: string }
    Invoice:
      type: object
      required: [id, number, kind, total, issuedAt]
      properties:
        id: { type: string }
        number: { type: string, example: INV/26-27/000123 }
        kind: { type: string, enum: [tax_invoice, bill_of_supply, invoice_cum_bos] }
        total: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        deliveryId: { type: [string, 'null'] }
        orderId: { type: [string, 'null'] }
        issuedAt: { type: string, format: date-time }

    # ── Agent ──
    RunSummary:
      type: object
      required: [id, date, status, stopCount]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        slot:
          type: object
          properties:
            code: { type: string }
            label: { type: string }
        route:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        status: { type: string, enum: [planned, started, completed] }
        stopCount: { type: integer }
        completedCount: { type: integer }
    Stop:
      type: object
      required: [deliveryId, sequence, status, customer, address, items]
      properties:
        deliveryId: { type: string }
        sequence: { type: integer }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        customer:
          type: object
          properties:
            name: { type: string, description: 'Shortened, e.g. Asha V.' }
            phone: { type: string }
        address:
          type: object
          properties:
            line1: { type: string }
            landmark: { type: string }
            location: { $ref: '#/components/schemas/GeoPoint' }
            instructions: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              quantity: { type: integer }
        bottles:
          type: object
          properties:
            toDeliver: { type: integer }
            outstanding: { type: integer }
    Run:
      allOf:
        - $ref: '#/components/schemas/RunSummary'
        - type: object
          required: [stops, loadSheet]
          properties:
            loadSheet:
              type: array
              items:
                type: object
                properties:
                  variantId: { type: string }
                  name: { type: string }
                  quantity: { type: integer }
            stops:
              type: array
              items: { $ref: '#/components/schemas/Stop' }
            updatedAt: { type: string, format: date-time }
    AgentEventInput:
      type: object
      required: [clientEventId, type, occurredAt]
      properties:
        clientEventId: { type: string, format: uuid, description: Generated on the phone; makes retries safe }
        type: { type: string, enum: [delivered, not_available, refused, missed] }
        occurredAt: { type: string, format: date-time }
        bottlesCollected: { type: integer, minimum: 0, maximum: 20 }
        photoUploadId: { type: [string, 'null'] }
        note: { type: [string, 'null'], maxLength: 500 }
        location: { $ref: '#/components/schemas/GeoPoint' }
    SyncResult:
      type: object
      required: [clientEventId, status]
      properties:
        clientEventId: { type: string }
        status: { type: string, enum: [applied, duplicate, rejected] }
        code: { type: string, description: Error code when rejected }
        deliveryStatus: { $ref: '#/components/schemas/DeliveryStatus' }
    UploadRequest:
      type: object
      required: [purpose, contentType, sizeBytes]
      properties:
        purpose: { type: string, enum: [proof_photo, issue_photo, product_media, content_media] }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4] }
        sizeBytes: { type: integer, minimum: 1, maximum: 52428800 }
    Upload:
      type: object
      required: [uploadId, url, method, expiresAt]
      properties:
        uploadId: { type: string }
        url: { type: string, format: uri }
        method: { type: string, const: PUT }
        headers:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }

    # ── Admin ──
    Dashboard:
      type: object
      properties:
        date: { type: string, format: date }
        tomorrow:
          type: object
          properties:
            deliveries: { type: integer }
            byVariant:
              type: array
              items:
                type: object
                properties:
                  variantId: { type: string }
                  name: { type: string }
                  quantity: { type: integer }
        activeSubscriptions: { type: integer }
        newSubscriptions7d: { type: integer }
        churned7d: { type: integer }
        revenueToday: { $ref: '#/components/schemas/Money' }
        walletFloat: { $ref: '#/components/schemas/Money' }
        alerts:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, examples: [low_stock, near_expiry, cutoff_failed, reconciliation_mismatch] }
              message: { type: string }
    DispatchBoard:
      type: object
      properties:
        date: { type: string, format: date }
        slotId: { type: string }
        cutoff:
          type: object
          properties:
            status: { type: string, enum: [pending, running, completed, failed] }
            at: { type: string, format: date-time }
            stats: { type: object, additionalProperties: true }
        runs:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/RunSummary'
              - type: object
                properties:
                  agent:
                    type: [object, 'null']
                    properties:
                      id: { type: string }
                      name: { type: string }
                  byStatus:
                    type: object
                    additionalProperties: { type: integer }
    ProductionPlan:
      type: object
      properties:
        date: { type: string, format: date }
        generatedAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            properties:
              variantId: { type: string }
              name: { type: string }
              required: { type: integer }
              buffer: { type: integer }
              inStock: { type: integer }
              toProduce: { type: integer }
    AdminVariantInput:
      type: object
      required: [sku, packSize, unit, unitQuantity, price, hsnCode, gstRateBps]
      properties:
        id: { type: string, description: Present when updating an existing variant }
        sku: { type: string }
        packSize: { type: string }
        unit: { type: string, enum: [ml, g, pcs] }
        unitQuantity: { type: integer }
        price: { $ref: '#/components/schemas/Money' }
        mrp: { $ref: '#/components/schemas/Money' }
        subscriptionPrice: { $ref: '#/components/schemas/Money' }
        hsnCode: { type: string }
        gstRateBps: { type: integer, description: 'GST rate in basis points, e.g. 500 = 5%' }
        shelfLifeDays: { type: integer }
        storage: { type: string, enum: [chilled, frozen, ambient] }
        packaging: { type: string, enum: [pouch, bottle, tub, box] }
        bottleDeposit: { $ref: '#/components/schemas/Money' }
        subscribable: { type: boolean }
        status: { type: string, enum: [active, archived] }
    AdminProductInput:
      type: object
      properties:
        slug: { type: string }
        categoryId: { type: string }
        nameEn: { type: string }
        nameHi: { type: string }
        descriptionEn: { type: string }
        descriptionHi: { type: string }
        attributes: { $ref: '#/components/schemas/ProductAttributes' }
        isVeg: { type: boolean }
        status: { type: string, enum: [draft, active, archived] }
        variants:
          type: array
          items: { $ref: '#/components/schemas/AdminVariantInput' }
    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/AdminProductInput'
        - type: object
          required: [id]
          properties:
            id: { type: string }
            media:
              type: array
              items: { $ref: '#/components/schemas/Media' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AdminCustomer:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        zone: { type: [string, 'null'] }
        walletBalance: { $ref: '#/components/schemas/Money' }
        activeSubscriptions: { type: integer }
        bottlesOutstanding: { type: integer }
        createdAt: { type: string, format: date-time }
    Batch:
      type: object
      required: [id, variantId, code, manufacturedOn, expiresOn, onHand, reserved]
      properties:
        id: { type: string }
        variantId: { type: string }
        code: { type: string }
        manufacturedOn: { type: string, format: date }
        expiresOn: { type: string, format: date }
        quantityProduced: { type: integer }
        onHand: { type: integer }
        reserved: { type: integer }
        status: { type: string, enum: [active, depleted, expired] }
