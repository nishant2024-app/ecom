# Serves the admin single-page app inside its container. TLS and the security headers
# (CSP, HSTS) are added by the host's Nginx, see infra/nginx/dairy.conf.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
